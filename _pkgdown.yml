url: https://gillescolling.com/restrictR/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite::svglite
  fig.ext: svg
  bg: '#F5F6F8'
home:
  title: 'restrictR: Composable Runtime Contracts for R'
  description: |
    Build reusable validators from small building blocks using the base pipe
    operator. Define runtime contracts once and enforce them anywhere.
authors:
  Gilles Colling:
    href: https://github.com/gcol33
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - lightswitch
    - github
  components:
    intro:
      text: Get Started
      href: articles/restrictR.html
    articles:
      text: Articles
      menu:
      - text: Runtime Contracts for R Functions
        href: articles/restrictR.html
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/restrictR
reference:
- title: Core
  desc: Create and inspect validators
  contents:
  - restrict
  - as_contract_text
  - as_contract_block
  - require_custom
  - fail
  - steps
- title: Checking
  desc: Run a validator without throwing
  contents:
  - is_valid
  - validation_errors
- title: Type Checks
  desc: Validate value types
  contents:
  - require_df
  - require_numeric
  - require_integer
  - require_character
  - require_logical
  - require_class
- title: Null & Missingness
  desc: Check for NULL, NA, and non-finite values
  contents:
  - require_not_null
  - require_no_na
  - require_finite
- title: Structure Checks
  desc: Validate length, dimensions, names, columns, and order
  contents:
  - require_scalar
  - require_named
  - require_length
  - require_length_min
  - require_length_max
  - require_length_matches
  - require_nrow_min
  - require_nrow_matches
  - require_ncol_min
  - require_ncol_matches
  - require_dim
  - require_has_cols
  - require_names
  - require_unique_names
  - require_sorted
- title: Composition
  desc: Apply validators to columns and list elements, combine them, allow NULL
  contents:
  - require_col
  - require_each
  - require_fields
  - require_valid
  - require_any
  - allow_null
- title: Value Checks
  desc: Validate value ranges, set membership, and factor levels
  contents:
  - require_positive
  - require_negative
  - require_between
  - require_one_of
  - require_contains
  - require_set_equal
  - require_levels
  - require_disjoint
  - require_unique
- title: Character Checks
  desc: Validate strings by pattern, length, and blankness
  contents:
  - require_pattern
  - require_nchar
  - require_nonempty
- title: File-System Checks
  desc: Validate input paths and output locations
  contents:
  - require_file_exists
  - require_dir_exists
  - require_readable
  - require_writable
- title: Function Checks
  desc: Validate callback arguments
  contents:
  - require_function
- title: Testing
  desc: testthat expectations that report validator messages
  contents:
  - expect_valid
  - expect_invalid
articles:
- title: Getting Started
  navbar: ~
  contents: restrictR
footer:
  structure:
    left: developed_by
    right: built_with
